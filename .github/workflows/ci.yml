name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: 01-ci-testing/ci-playground

      - name: Build
        run: npm run build
        working-directory: 01-ci-testing/ci-playground

      - name: Run tests
        run: npm test
        working-directory: 01-ci-testing/ci-playground
